name: Format diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print Prettier diff
        run: |
          npx prettier --write tests/unit/reader-text-navigation.test.ts
          git diff -- tests/unit/reader-text-navigation.test.ts
