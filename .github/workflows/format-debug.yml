name: Format debug

on:
  push:
    branches:
      - feat/main-direct-prefixes

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write src/input/key-sequence.ts src/preferences/index.ts tests/unit/input.test.ts
          git diff -- src/input/key-sequence.ts src/preferences/index.ts tests/unit/input.test.ts
