name: Apply Reader outline state extraction

on:
  push:
    branches:
      - refactor/reader-outline-state

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/reader-outline-state
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply guarded extraction
        run: |
          node tools/apply-reader-outline-state.mjs
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src/reader/outline.ts';
          let source = readFileSync(path, 'utf8');
          const before = 'this.close(state, pdfWindow)';
          const count = source.split(before).length - 1;
          if (count !== 2) throw new Error(`Expected 2 internal Outline close calls, found ${count}`);
          source = source.split(before).join('this.close(pdfWindow)');
          writeFileSync(path, source);
          NODE
          rm tools/apply-reader-outline-state.mjs .github/workflows/apply-reader-outline-state-once.yml
      - name: Format and verify
        run: |
          npx prettier --write src/reader/controller.ts src/reader/types.ts src/reader/outline.ts tests/unit/reader-controller.test.ts docs/DEVELOPMENT.md
          npm run verify
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(reader): let outline own transient state"
          git push origin HEAD:refactor/reader-outline-state
