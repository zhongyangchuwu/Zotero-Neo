name: Apply IME runtime refactor

on:
  push:
    branches:
      - feat/flash-unicode-ime

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/flash-unicode-ime
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Patch runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/main/session.ts',
              "import { CleanupScope } from '../core/cleanup';\n",
              "import { CleanupScope } from '../core/cleanup';\nimport type { CompositionState } from '../input/composition';\n",
          )
          replace(
              'src/main/session.ts',
              "    input: HTMLInputElement | null;\n    results: HTMLElement | null;",
              "    input: HTMLInputElement | null;\n    composition: CompositionState;\n    results: HTMLElement | null;",
          )
          replace(
              'src/main/session.ts',
              "    input: null,\n    results: null,",
              "    input: null,\n    composition: { active: false },\n    results: null,",
          )

          replace(
              'src/main/picker/shell.ts',
              "import { asElement } from '../../platform/dom';\n",
              "import { asElement } from '../../platform/dom';\nimport { bindCompositionState, compositionOwnsKey, isCommittedInput } from '../../input/composition';\n",
          )
          replace(
              'src/main/picker/shell.ts',
              "        input,\n        results,",
              "        input,\n        composition: { active: false },\n        results,",
          )
          replace(
              'src/main/picker/shell.ts',
              "      const inputHandler = (): void => {\n        const focusID = provider.filter\n          ? String(session.picker.filtered[session.picker.selected]?.id ?? '')\n          : '';\n        if (provider.filter) provider.filter(input.value, session.picker.commands!, focusID);\n        else {\n          session.picker.selected = 0;\n          this.filter(session, input.value);\n        }\n      };\n      input.addEventListener('input', inputHandler);",
              "      const compositionCleanup = bindCompositionState(input, session.picker.composition);\n      const inputHandler = (event: Event): void => {\n        if (!isCommittedInput(event, session.picker.composition.active)) return;\n        const focusID = provider.filter\n          ? String(session.picker.filtered[session.picker.selected]?.id ?? '')\n          : '';\n        if (provider.filter) provider.filter(input.value, session.picker.commands!, focusID);\n        else {\n          session.picker.selected = 0;\n          this.filter(session, input.value);\n        }\n      };\n      input.addEventListener('input', inputHandler);",
          )
          replace(
              'src/main/picker/shell.ts',
              "      session.picker.inputCleanup = () => {\n        input.removeEventListener('input', inputHandler);",
              "      session.picker.inputCleanup = () => {\n        compositionCleanup();\n        input.removeEventListener('input', inputHandler);",
          )
          replace(
              'src/main/picker/shell.ts',
              "    session.picker.input = null;\n    session.picker.results = null;",
              "    session.picker.input = null;\n    session.picker.composition.active = false;\n    session.picker.results = null;",
          )
          replace(
              'src/main/picker/shell.ts',
              "    event._zvPickerHandled = true;\n    const picker = session.picker;\n    const key = event.key;",
              "    event._zvPickerHandled = true;\n    const picker = session.picker;\n    if (compositionOwnsKey(event, picker.composition.active)) {\n      event.stopPropagation();\n      return;\n    }\n    const key = event.key;",
          )

          replace(
              'src/main/tag-workspace.ts',
              "import { THEME_VARS } from '../ui/theme';\n",
              "import { THEME_VARS } from '../ui/theme';\nimport { bindCompositionState, compositionOwnsKey, isCommittedInput, type CompositionState } from '../input/composition';\n",
          )
          replace(
              'src/main/tag-workspace.ts',
              "  readonly themeCleanup: () => void;\n  tags: TagRecord[];",
              "  readonly themeCleanup: () => void;\n  readonly composition: CompositionState;\n  inputCleanup: () => void;\n  tags: TagRecord[];",
          )
          replace(
              'src/main/tag-workspace.ts',
              "      themeCleanup,\n      tags,",
              "      themeCleanup,\n      composition: { active: false },\n      inputCleanup: () => {},\n      tags,",
          )
          replace(
              'src/main/tag-workspace.ts',
              "    input.addEventListener('input', () => {\n      state.selected = 0;\n      this.render(state);\n    });",
              "    const compositionCleanup = bindCompositionState(input, state.composition);\n    const inputHandler = (event: Event): void => {\n      if (!isCommittedInput(event, state.composition.active)) return;\n      state.selected = 0;\n      this.render(state);\n    };\n    input.addEventListener('input', inputHandler);\n    state.inputCleanup = () => {\n      compositionCleanup();\n      input.removeEventListener('input', inputHandler);\n    };",
          )
          replace(
              'src/main/tag-workspace.ts',
              "    this.#states.delete(window);\n    state.themeCleanup();",
              "    this.#states.delete(window);\n    state.inputCleanup();\n    state.themeCleanup();",
          )
          replace(
              'src/main/tag-workspace.ts',
              "    const state = this.#states.get(window);\n    if (!state) return;\n    const lower = event.key.toLowerCase();",
              "    const state = this.#states.get(window);\n    if (!state) return;\n    if (compositionOwnsKey(event, state.composition.active)) {\n      event.stopPropagation();\n      return;\n    }\n    const lower = event.key.toLowerCase();",
          )

          replace(
              'src/reader/flash.ts',
              "import { HINT_ALPHABET } from './hint-labels';\n",
              "import { bindCompositionState, compositionOwnsKey, isCommittedInput, type CompositionState } from '../input/composition';\nimport { HINT_ALPHABET } from './hint-labels';\n",
          )
          replace(
              'src/reader/flash.ts',
              "  #targets: FlashTarget[] = [];\n  #prompt: HTMLElement | null = null;\n  #matchCount = 0;",
              "  #targets: FlashTarget[] = [];\n  #prompt: HTMLElement | null = null;\n  #input: HTMLInputElement | null = null;\n  #inputCleanup: (() => void) | null = null;\n  readonly #composition: CompositionState = { active: false };\n  #matchCount = 0;",
          )
          replace(
              'src/reader/flash.ts',
              "      this.#prompt = this.#createPrompt(pdfWindow);\n      this.#refreshPrompt();",
              "      this.#prompt = this.#createPrompt(pdfWindow);\n      this.#input = this.#createInput(pdfWindow);\n      this.#input.focus();\n      this.#refreshPrompt();",
          )

          old_handle = '''  /** Returns false when an event belongs to another split view after cancelling this invocation. */\n  handleKey(event: KeyboardEvent, pdfWindow: PdfWindow): boolean {\n    if (!this.#window) return false;\n    if (pdfWindow !== this.#window) {\n      this.cancel();\n      return false;\n    }\n\n    event.preventDefault();\n    event.stopImmediatePropagation();\n    if (event.key === 'Escape') {\n      this.cancel();\n      pdfWindow.focus();\n      return true;\n    }\n\n    if (this.#labelBuffer) this.#handleLabelKey(event);\n    else this.#handleQueryKey(event);\n    return true;\n  }'''
          new_handle = '''  /** Returns false when an event belongs to another split view after cancelling this invocation. */\n  handleKey(event: KeyboardEvent, pdfWindow: PdfWindow): boolean {\n    if (!this.#window) return false;\n    if (pdfWindow !== this.#window) {\n      this.cancel();\n      return false;\n    }\n\n    if (compositionOwnsKey(event, this.#composition.active)) {\n      event.stopPropagation();\n      return true;\n    }\n\n    const consumeCommand = (): void => {\n      event.preventDefault();\n      event.stopImmediatePropagation();\n    };\n    if (event.key === 'Escape') {\n      consumeCommand();\n      this.cancel();\n      pdfWindow.focus();\n      return true;\n    }\n\n    if (this.#labelBuffer) {\n      consumeCommand();\n      this.#handleLabelKey(event);\n      return true;\n    }\n\n    if (event.key === 'Enter' || event.key === 'Return') {\n      consumeCommand();\n      const first = this.#targets[0];\n      if (first) this.#activate(first);\n      return true;\n    }\n\n    if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.length === 1) {\n      const labelKey = event.key.toUpperCase();\n      if (\n        /^[A-Z]$/.test(labelKey) &&\n        this.#targets.some((target) => target.label.startsWith(labelKey))\n      ) {\n        consumeCommand();\n        this.#labelBuffer = labelKey;\n        this.#refreshLabels();\n        const exact = this.#targets.find((target) => target.label === labelKey);\n        if (exact) this.#activate(exact);\n        return true;\n      }\n    }\n\n    // Keep Reader/Zotero shortcuts from seeing query-editing keys, but preserve the input's default edit.\n    event.stopPropagation();\n    return true;\n  }'''
          replace('src/reader/flash.ts', old_handle, new_handle)

          replace(
              'src/reader/flash.ts',
              "    this.#clearTargets();\n    this.#prompt?.remove();\n    this.#prompt = null;",
              "    this.#clearTargets();\n    this.#inputCleanup?.();\n    this.#inputCleanup = null;\n    this.#input?.remove();\n    this.#input = null;\n    this.#composition.active = false;\n    this.#prompt?.remove();\n    this.#prompt = null;",
          )

          old_query = '''  #handleQueryKey(event: KeyboardEvent): void {\n    if (event.key === 'Backspace') {\n      this.#query = this.#query.slice(0, -1);\n      this.#refreshTargets();\n      return;\n    }\n    if (event.key === 'Enter' || event.key === 'Return') {\n      const first = this.#targets[0];\n      if (first) this.#activate(first);\n      return;\n    }\n    if (event.ctrlKey || event.metaKey || event.altKey || event.key.length !== 1) return;\n    const code = event.key.charCodeAt(0);\n    if (code < 0x20 || code > 0x7e) return;\n\n    const labelKey = event.key.toUpperCase();\n    if (\n      /^[A-Z]$/.test(labelKey) &&\n      this.#targets.some((target) => target.label.startsWith(labelKey))\n    ) {\n      this.#labelBuffer = labelKey;\n      this.#refreshLabels();\n      const exact = this.#targets.find((target) => target.label === labelKey);\n      if (exact) this.#activate(exact);\n      return;\n    }\n\n    this.#query += event.key;\n    this.#refreshTargets();\n  }\n\n'''
          replace('src/reader/flash.ts', old_query, '')

          create_input = '''  #createInput(pdfWindow: PdfWindow): HTMLInputElement {\n    const input = pdfWindow.document.createElement('input') as HTMLInputElement;\n    input.dataset.zoteroNeoFlashInput = '1';\n    input.type = 'text';\n    input.autocomplete = 'off';\n    input.spellcheck = false;\n    input.placeholder = 'Type visible text…';\n    input.style.cssText =\n      'position:fixed;left:12px;bottom:46px;z-index:100001;width:min(360px,calc(100vw - 24px));box-sizing:border-box;padding:6px 8px;border:2px solid #8ab4ff;border-radius:5px;background:#0f172a;color:#ffffff;outline:none;font:13px/1.2 monospace;box-shadow:0 4px 14px rgba(0,0,0,.28);';\n    const compositionCleanup = bindCompositionState(input, this.#composition);\n    const inputHandler = (event: Event): void => {\n      if (!isCommittedInput(event, this.#composition.active)) return;\n      this.#query = input.value;\n      this.#refreshTargets();\n    };\n    input.addEventListener('input', inputHandler);\n    this.#inputCleanup = () => {\n      compositionCleanup();\n      input.removeEventListener('input', inputHandler);\n    };\n    pdfWindow.document.body?.appendChild(input);\n    return input;\n  }\n\n'''
          replace(
              'src/reader/flash.ts',
              "  #createPrompt(pdfWindow: PdfWindow): HTMLElement {",
              create_input + "  #createPrompt(pdfWindow: PdfWindow): HTMLElement {",
          )
          PY
      - name: Verify runtime
        shell: bash
        run: |
          npm ci
          npx prettier --write src/input/composition.ts src/main/session.ts src/main/picker/shell.ts src/main/tag-workspace.ts src/reader/flash.ts
          npm run typecheck
          npm run build
      - name: Commit runtime refactor
        shell: bash
        run: |
          rm .github/workflows/apply-ime-runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(input): make text surfaces composition-safe"
          git push origin HEAD:feat/flash-unicode-ime
