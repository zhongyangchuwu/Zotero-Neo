name: Documentation Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - .vitepress/**
      - CHANGELOG.md
      - README.md
      - assets/branding/**
      - docs/**/*.md
      - index.md
      - package-lock.json
      - package.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - .vitepress/**
      - CHANGELOG.md
      - README.md
      - assets/branding/**
      - docs/**/*.md
      - index.md
      - package-lock.json
      - package.json
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Build site
        run: npm run docs:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5; https://api.github.com/repos/actions/upload-pages-artifact/git/ref/tags/v5
        with:
          path: .vitepress/dist

  deploy:
    name: Deploy documentation
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6; https://api.github.com/repos/actions/configure-pages/git/ref/tags/v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5; https://api.github.com/repos/actions/deploy-pages/git/ref/tags/v5
