name: Reader text hint extraction

on:
  push:
    branches:
      - refactor/reader-text-navigation
    paths:
      - tools/refactor-reader-text-hints.mjs
      - tools/refactor-reader-text-hints-fix.mjs
      - .github/workflows/refactor-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/reader-text-navigation
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply guarded extraction and remove scaffolding
        run: |
          node tools/refactor-reader-text-hints.mjs
          node tools/refactor-reader-text-hints-fix.mjs
          rm tools/refactor-reader-text-hints.mjs tools/refactor-reader-text-hints-fix.mjs .github/workflows/refactor-once.yml
      - name: Format and verify
        run: |
          npx prettier --write src/reader/controller.ts src/reader/types.ts src/reader/hint-labels.ts src/reader/text-hints.ts tests/unit/reader-text-navigation.test.ts
          npm run verify
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(reader): extract text hint lifecycle"
          git push origin HEAD:refactor/reader-text-navigation
