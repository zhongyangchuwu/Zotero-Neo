name: Vendor fuzzysort

on:
  push:
    branches:
      - chore/fuzzysort-matcher

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/fuzzysort-matcher
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fetch pinned fuzzysort package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fuzzysort-package /tmp/fuzzysort-pack
          mkdir -p /tmp/fuzzysort-package /tmp/fuzzysort-pack
          npm pack fuzzysort@4.0.2 --pack-destination /tmp/fuzzysort-pack >/tmp/fuzzysort-pack/name.txt
          tar -xzf "/tmp/fuzzysort-pack/$(cat /tmp/fuzzysort-pack/name.txt)" -C /tmp/fuzzysort-package
          test "$(git hash-object /tmp/fuzzysort-package/package/fuzzysort.min.js)" = "249c912980f4d29352d59e0304b0416162b707db"
          mkdir -p vendor/fuzzysort
          cp /tmp/fuzzysort-package/package/fuzzysort.min.js vendor/fuzzysort/fuzzysort.js
          cp /tmp/fuzzysort-package/package/index.d.ts vendor/fuzzysort/fuzzysort.d.ts
          cp /tmp/fuzzysort-package/package/LICENSE vendor/fuzzysort/LICENSE
      - name: Commit exact vendored files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/fuzzysort
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(vendor): sync fuzzysort 4.0.2"
          git push origin HEAD:chore/fuzzysort-matcher
