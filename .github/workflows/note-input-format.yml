name: Note input format (temporary)

on:
  push:
    branches:
      - refactor/note-input-unification

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/input/note-actions.ts src/main/controller.ts src/main/note-action-capabilities.ts src/main/note-editor.ts
      - name: Commit formatting and remove scaffold
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/note-input-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(note): format shared Note input refactor"
          git push
