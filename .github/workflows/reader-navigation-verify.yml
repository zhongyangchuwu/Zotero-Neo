name: Reader navigation verification (temporary)

on:
  push:
    branches:
      - refactor/reader-navigation-host

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show canonical Prettier diff
        run: |
          npx prettier --write src/reader/controller.ts src/reader/navigation.ts
          git diff --unified=1 -- src/reader/controller.ts src/reader/navigation.ts
          test -z "$(git status --short -- src/reader/controller.ts src/reader/navigation.ts)"
