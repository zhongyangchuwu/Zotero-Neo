name: Rename Select preference once

on:
  push:
    branches:
      - feat/reader-flash-text
    paths:
      - .github/workflows/rename-select-preference-once.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/reader-flash-text
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rename Select preference
        run: |
          node tools/rename-select-preference.mjs
          rm tools/rename-select-preference.mjs .github/workflows/rename-select-preference-once.yml
      - name: Format and verify
        run: |
          npx prettier --write src/preferences/index.ts assets/package/content/preferences/pane.xhtml
          npm run verify
      - name: Commit Select preference wording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(ui): call Visual workflow Select"
          git push origin HEAD:feat/reader-flash-text
