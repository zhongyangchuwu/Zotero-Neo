name: Note input verification (temporary)
# trigger: typed-and-runtime verification

on:
  push:
    branches:
      - refactor/note-input-unification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
