name: Rebase PR14 onto main once

on:
  push:
    branches:
      - refactor/reader-marks-explorer-state

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/reader-marks-explorer-state
          fetch-depth: 0
      - name: Rebuild stacked branch on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase --onto origin/main 72292e4b4380c466afad82ba79bba5e986293413
          rm .github/workflows/rebase-pr14-once.yml
          git add -A
          git commit -m "chore(refactor): finish PR14 rebase"
          git push --force-with-lease origin HEAD:refactor/reader-marks-explorer-state
