name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional version tag to publish from main (for example v0.1.0)
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build XPI
        run: ./tools/build.sh
      - name: Upload Linux XPI
        uses: actions/upload-artifact@v7
        with:
          name: zotero-neo-linux
          path: zotero-neo.xpi
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build XPI
        shell: pwsh
        run: ./tools/build.ps1
      - name: Upload Windows XPI
        uses: actions/upload-artifact@v7
        with:
          name: zotero-neo-windows
          path: zotero-neo.xpi
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_RELEASE_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Validate release metadata
        run: node tools/check-release.mjs "${{ steps.release.outputs.tag }}"
      - name: Create release tag for manual publication
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          existing="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "Tag $tag already exists at $existing, expected $GITHUB_SHA" >&2
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
      - name: Download canonical XPI
        uses: actions/download-artifact@v8
        with:
          name: zotero-neo-linux
          path: release
      - name: Verify XPI archive
        run: unzip -t release/zotero-neo.xpi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/zotero-neo.xpi --clobber
          else
            gh release create "$tag" release/zotero-neo.xpi --verify-tag --generate-notes --title "Zotero Neo $tag"
          fi
