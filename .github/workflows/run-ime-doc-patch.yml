name: Run IME doc patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/flash-unicode-ime
      - name: Patch docs
        run: python tools/patch-ime-docs.py
      - name: Commit
        run: |
          rm tools/patch-ime-docs.py
          rm .github/workflows/patch-ime-docs.yml
          rm .github/workflows/run-ime-doc-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(input): align IME and matcher architecture"
          git push origin HEAD:feat/flash-unicode-ime
