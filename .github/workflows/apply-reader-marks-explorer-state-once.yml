name: Apply Reader marks explorer state extraction

on:
  push:
    branches:
      - refactor/reader-marks-explorer-state

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/reader-marks-explorer-state
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply guarded extraction
        run: |
          node tools/apply-reader-marks-explorer-state.mjs
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'tests/unit/reader-controller.test.ts';
          let source = readFileSync(path, 'utf8');
          const before = "    created.session.focusAndHandle(readerKey('Escape').event);\n    vi.advanceTimersByTime(30);\n    expect(created.pdfWindow.focus).toHaveBeenCalledOnce();";
          const after = "    created.session.focusAndHandle(readerKey('Escape').event);\n    vi.advanceTimersByTime(30);\n    expect(created.pdfWindow.focus).toHaveBeenCalledTimes(2);";
          const first = source.indexOf(before);
          if (first < 0) throw new Error('Missing sidebar focus assertion');
          if (source.indexOf(before, first + before.length) >= 0)
            throw new Error('Non-unique sidebar focus assertion');
          source = source.slice(0, first) + after + source.slice(first + before.length);
          writeFileSync(path, source);
          NODE
          rm tools/apply-reader-marks-explorer-state.mjs .github/workflows/apply-reader-marks-explorer-state-once.yml
      - name: Format and verify
        run: |
          npx prettier --write src/reader/controller.ts src/reader/types.ts src/reader/marks-explorer.ts tests/unit/reader-controller.test.ts docs/DEVELOPMENT.md
          npm run verify
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(reader): let marks explorer own transient state"
          git push origin HEAD:refactor/reader-marks-explorer-state
