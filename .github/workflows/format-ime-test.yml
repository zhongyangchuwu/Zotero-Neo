name: Format IME test
on: [push]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/flash-unicode-ime
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/unit/flash-unicode.test.ts
      - name: Commit
        run: |
          rm .github/workflows/format-ime-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style(test): apply Prettier to Flash Unicode coverage"
          git push origin HEAD:feat/flash-unicode-ime
