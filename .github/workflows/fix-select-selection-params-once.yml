name: Fix Select range freshness once

on:
  push:
    branches:
      - feat/reader-flash-text
    paths:
      - .github/workflows/fix-select-selection-params-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/reader-flash-text
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply range freshness fix
        run: |
          node tools/fix-select-selection-params.mjs
          rm tools/fix-select-selection-params.mjs .github/workflows/fix-select-selection-params-once.yml
      - name: Format and verify
        run: |
          npx prettier --write src/reader/controller.ts tests/unit/reader-controller.test.ts
          npm run verify
      - name: Commit range freshness fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reader): invalidate stale selection geometry"
          git push origin HEAD:feat/reader-flash-text
