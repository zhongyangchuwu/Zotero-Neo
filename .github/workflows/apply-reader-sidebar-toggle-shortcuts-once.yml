name: Apply Reader sidebar toggle shortcuts

on:
  push:
    branches:
      - feat/reader-sidebar-toggle-shortcuts

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/reader-sidebar-toggle-shortcuts
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply guarded change
        run: |
          node tools/apply-reader-sidebar-toggle-shortcuts.mjs
          rm tools/apply-reader-sidebar-toggle-shortcuts.mjs .github/workflows/apply-reader-sidebar-toggle-shortcuts-once.yml
      - name: Format and verify
        run: |
          npx prettier --write src/reader/controller.ts tests/unit/reader-controller.test.ts
          npm run verify
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(reader): toggle sidebars from their own shortcuts"
          git push origin HEAD:feat/reader-sidebar-toggle-shortcuts
