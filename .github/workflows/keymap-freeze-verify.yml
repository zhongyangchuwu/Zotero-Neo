name: 0.1.0 keymap freeze verification (temporary)

on:
  push:
    branches:
      - release/0.1.0-keymap-freeze

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Verified upstream ref: https://api.github.com/repos/actions/checkout/git/ref/tags/v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Verified upstream ref: https://api.github.com/repos/actions/setup-node/git/ref/tags/v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
