name: 0.1.0 keymap freeze verification (temporary)

on:
  push:
    branches:
      - release/0.1.0-keymap-freeze

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
