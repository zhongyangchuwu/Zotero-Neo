name: 0.1.0 keymap freeze verification (temporary)

on:
  push:
    branches:
      - release/0.1.0-keymap-freeze

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show canonical Prettier diff
        run: |
          npx prettier --write tests/unit/keymap-freeze.test.ts
          git diff --unified=1 -- tests/unit/keymap-freeze.test.ts
          test -z "$(git status --short -- tests/unit/keymap-freeze.test.ts)"
