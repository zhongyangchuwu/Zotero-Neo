name: Apply IME tests

on:
  push:
    branches:
      - feat/flash-unicode-ime

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/flash-unicode-ime
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Patch tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          path = 'tests/unit/flash.test.ts'
          replace(
              path,
              '''    createElement: () => {\n      const element = {\n        dataset: {} as Record<string, string>,\n        style: { cssText: '', left: '', top: '' },\n        hidden: false,\n        textContent: '',\n        remove: vi.fn(() => {\n          const index = bodyChildren.indexOf(element as unknown as HTMLElement);\n          if (index >= 0) bodyChildren.splice(index, 1);\n        }),\n      };\n      return element as unknown as HTMLElement;\n    },''',
              '''    createElement: (tag: string) => {\n      const listeners = new Map<string, EventListener[]>();\n      const element = {\n        tagName: tag.toUpperCase(),\n        dataset: {} as Record<string, string>,\n        style: { cssText: '', left: '', top: '' },\n        hidden: false,\n        textContent: '',\n        value: '',\n        type: '',\n        autocomplete: '',\n        spellcheck: false,\n        placeholder: '',\n        addEventListener: (type: string, listener: EventListener) => {\n          listeners.set(type, [...(listeners.get(type) ?? []), listener]);\n        },\n        removeEventListener: (type: string, listener: EventListener) => {\n          listeners.set(\n            type,\n            (listeners.get(type) ?? []).filter((candidate) => candidate !== listener),\n          );\n        },\n        emit: (type: string, event: Partial<Event> = {}) => {\n          const synthetic = { ...event, target: event.target ?? element } as Event;\n          for (const listener of listeners.get(type) ?? []) listener(synthetic);\n        },\n        focus: vi.fn(),\n        remove: vi.fn(() => {\n          const index = bodyChildren.indexOf(element as unknown as HTMLElement);\n          if (index >= 0) bodyChildren.splice(index, 1);\n        }),\n      };\n      return element as unknown as HTMLElement & {\n        emit(type: string, event?: Partial<Event>): void;\n      };\n    },''',
          )
          replace(
              path,
              '''function flashKey(key: string) {\n  return {\n    key,\n    ctrlKey: false,\n    metaKey: false,\n    altKey: false,\n    preventDefault: vi.fn(),\n    stopImmediatePropagation: vi.fn(),\n  } as unknown as KeyboardEvent;\n}\n''',
              '''function flashKey(\n  key: string,\n  target: EventTarget | null = null,\n  options: { isComposing?: boolean; keyCode?: number } = {},\n) {\n  return {\n    key,\n    target,\n    ctrlKey: false,\n    metaKey: false,\n    altKey: false,\n    isComposing: options.isComposing ?? false,\n    keyCode: options.keyCode ?? 0,\n    preventDefault: vi.fn(),\n    stopPropagation: vi.fn(),\n    stopImmediatePropagation: vi.fn(),\n  } as unknown as KeyboardEvent;\n}\n''',
          )
          replace(
              path,
              '''function flashPrompt(children: readonly HTMLElement[]): HTMLElement | undefined {\n  return children.find((element) => element.dataset.zoteroNeoFlashPrompt === '1');\n}\n''',
              '''function flashPrompt(children: readonly HTMLElement[]): HTMLElement | undefined {\n  return children.find((element) => element.dataset.zoteroNeoFlashPrompt === '1');\n}\n\nfunction flashInput(children: readonly HTMLElement[]):\n  | (HTMLInputElement & { emit(type: string, event?: Partial<Event>): void })\n  | undefined {\n  return children.find((element) => element.dataset.zoteroNeoFlashInput === '1') as\n    | (HTMLInputElement & { emit(type: string, event?: Partial<Event>): void })\n    | undefined;\n}\n\nfunction setFlashQuery(children: readonly HTMLElement[], value: string): void {\n  const input = flashInput(children);\n  if (!input) throw new Error('Expected Flash input');\n  input.value = value;\n  input.emit('input', { isComposing: false } as unknown as Partial<Event>);\n}\n\nfunction typeFlashKey(\n  flash: ReaderFlash,\n  created: ReturnType<typeof createFlashWindow>,\n  key: string,\n): KeyboardEvent {\n  const input = flashInput(created.bodyChildren);\n  if (!input) throw new Error('Expected Flash input');\n  const event = flashKey(key, input);\n  flash.handleKey(event, created.pdfWindow);\n  if (!(event.preventDefault as ReturnType<typeof vi.fn>).mock.calls.length) {\n    if (key === 'Backspace') input.value = Array.from(input.value).slice(0, -1).join('');\n    else if (key.length === 1) input.value += key;\n    input.emit('input', { isComposing: false } as unknown as Partial<Event>);\n  }\n  return event;\n}\n''',
          )
          replace(
              path,
              "    for (const key of 'target') flash.handleKey(flashKey(key), created.pdfWindow);",
              "    setFlashQuery(created.bodyChildren, 'target');",
              count=4,
          )
          replace(
              path,
              "    flash.handleKey(flashKey('t'), created.pdfWindow);\n    flash.handleKey(flashKey('a'), created.pdfWindow);",
              "    setFlashQuery(created.bodyChildren, 'ta');",
          )
          replace(
              path,
              "    flash.handleKey(flashKey('s'), created.pdfWindow);",
              "    typeFlashKey(flash, created, 's');",
          )

          insert_before = "  it('cancels instead of reindexing when the viewport changes', () => {"
          new_tests = '''  it('commits CJK IME text through the real input without leaking candidate keys', () => {\n    const created = createFlashWindow([{ value: '机器学习 方法', left: 20, top: 20 }]);\n    const { flash, activations } = createFlash();\n    flash.open(created.pdfWindow, 'visual-start');\n    const input = flashInput(created.bodyChildren);\n    if (!input) throw new Error('Expected Flash input');\n\n    input.emit('compositionstart');\n    input.value = 'jiqi';\n    input.emit('input', { isComposing: true } as unknown as Partial<Event>);\n    expect(flashHints(created.bodyChildren)).toHaveLength(0);\n\n    const enter = flashKey('Enter', input, { isComposing: true, keyCode: 229 });\n    flash.handleKey(enter, created.pdfWindow);\n    expect(enter.preventDefault).not.toHaveBeenCalled();\n    expect(activations).toHaveLength(0);\n\n    input.value = '机器';\n    input.emit('compositionend');\n    input.emit('input', { isComposing: false } as unknown as Partial<Event>);\n    expect(flashPrompt(created.bodyChildren)?.textContent).toContain('机器 (1)');\n    expect(flashHints(created.bodyChildren)).toHaveLength(1);\n  });\n\n  it('leaves Backspace to the browser input instead of slicing UTF-16 query text', () => {\n    const created = createFlashWindow([{ value: '😀 emoji', left: 20, top: 20 }]);\n    const { flash } = createFlash();\n    flash.open(created.pdfWindow, 'visual-start');\n    setFlashQuery(created.bodyChildren, '😀');\n    const input = flashInput(created.bodyChildren);\n    if (!input) throw new Error('Expected Flash input');\n\n    const backspace = flashKey('Backspace', input);\n    flash.handleKey(backspace, created.pdfWindow);\n    expect(backspace.preventDefault).not.toHaveBeenCalled();\n    input.value = '';\n    input.emit('input', { isComposing: false } as unknown as Partial<Event>);\n    expect(flashPrompt(created.bodyChildren)?.textContent).toBe('SELECT START: …');\n  });\n\n'''
          replace(path, insert_before, new_tests + insert_before)

          picker = 'tests/unit/fuzzy-picker.test.ts'
          replace(
              picker,
              "  options: { ctrl?: boolean; shift?: boolean } = {},",
              "  options: { ctrl?: boolean; shift?: boolean; isComposing?: boolean; keyCode?: number } = {},",
          )
          replace(
              picker,
              "    altKey: false,\n    preventDefault: vi.fn(),",
              "    altKey: false,\n    isComposing: options.isComposing ?? false,\n    keyCode: options.keyCode ?? 0,\n    preventDefault: vi.fn(),",
          )
          marker = "describe('picker mouse activation', () => {"
          picker_test = '''describe('picker IME boundary', () => {\n  it('defers filtering and command keys until composition commits', async () => {\n    const first = {\n      id: 1,\n      isRegularItem: () => true,\n      getField: (field: string) => (field === 'title' ? '机器人学习' : ''),\n      getCreators: () => [],\n      getAttachments: () => [],\n      getNotes: () => [],\n    } as unknown as Zotero.Item;\n    const second = {\n      id: 2,\n      isRegularItem: () => true,\n      getField: (field: string) => (field === 'title' ? 'Diffusion Models' : ''),\n      getCreators: () => [],\n      getAttachments: () => [],\n      getNotes: () => [],\n    } as unknown as Zotero.Item;\n    const selectItem = vi.fn(async () => undefined);\n    vi.stubGlobal('Services', { focus: { focusedWindow: null } });\n    vi.stubGlobal('Zotero', {\n      Items: { getAll: async () => [first, second] },\n      Libraries: { userLibraryID: 1 },\n    });\n    const { window, session } = createPickerHarness();\n    Object.assign(window, { ZoteroPane: { getSelectedItems: () => [], selectItem } });\n    const picker = new FuzzyPicker(\n      { debug: vi.fn(), diagnostic: vi.fn() },\n      new MainNavigation({ debug: vi.fn(), diagnostic: vi.fn() }, () => {}),\n    );\n\n    await picker.open(window, session, 'all');\n    const input = session.picker.input as HTMLInputElement & {\n      emit(type: string, event?: Partial<Event>): void;\n    };\n    input.emit('compositionstart');\n    input.value = '机器人';\n    input.emit('input', { isComposing: true } as unknown as Partial<Event>);\n    expect(session.picker.filtered).toHaveLength(2);\n\n    const enter = pickerKey('Enter', input, { isComposing: true, keyCode: 229 });\n    picker.onKeyDown(enter, window, session);\n    expect(enter.preventDefault).not.toHaveBeenCalled();\n    expect(selectItem).not.toHaveBeenCalled();\n    expect(session.picker.open).toBe(true);\n\n    const selectedBefore = session.picker.selected;\n    picker.onKeyDown(\n      pickerKey('ArrowDown', input, { isComposing: true, keyCode: 229 }),\n      window,\n      session,\n    );\n    expect(session.picker.selected).toBe(selectedBefore);\n\n    input.emit('compositionend');\n    input.emit('input', { isComposing: false } as unknown as Partial<Event>);\n    expect(session.picker.filtered.map((item) => item.id)).toEqual([first.id]);\n  });\n});\n\n'''
          replace(picker, marker, picker_test + marker)

          Path('tests/unit/composition.test.ts').write_text('''import { describe, expect, it, vi } from 'vitest';\n\nimport {\n  bindCompositionState,\n  compositionOwnsKey,\n  isCommittedInput,\n} from '../../src/input/composition';\n\ndescribe('composition input boundary', () => {\n  it('tracks composition and only treats committed input as semantic text', () => {\n    const listeners = new Map<string, EventListener[]>();\n    const input = {\n      addEventListener: (type: string, listener: EventListener) =>\n        listeners.set(type, [...(listeners.get(type) ?? []), listener]),\n      removeEventListener: vi.fn(),\n    } as unknown as HTMLInputElement;\n    const state = { active: false };\n    const cleanup = bindCompositionState(input, state);\n    const emit = (type: string) => {\n      for (const listener of listeners.get(type) ?? []) listener({ type } as Event);\n    };\n\n    emit('compositionstart');\n    expect(state.active).toBe(true);\n    expect(isCommittedInput({ isComposing: true } as unknown as Event, state.active)).toBe(false);\n    expect(\n      compositionOwnsKey(\n        { key: 'Enter', isComposing: true, keyCode: 229 } as unknown as KeyboardEvent,\n        state.active,\n      ),\n    ).toBe(true);\n\n    emit('compositionend');\n    expect(state.active).toBe(false);\n    expect(isCommittedInput({ isComposing: false } as unknown as Event, state.active)).toBe(true);\n    cleanup();\n  });\n});\n''')
          PY
      - name: Verify full suite
        shell: bash
        run: |
          npm ci
          npx prettier --write tests/unit/flash.test.ts tests/unit/fuzzy-picker.test.ts tests/unit/composition.test.ts
          npm run verify
      - name: Commit tests
        shell: bash
        run: |
          rm .github/workflows/apply-ime-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(input): cover Unicode and IME composition"
          git push origin HEAD:feat/flash-unicode-ime
