name: Apply Reader link hint extraction

on:
  push:
    branches:
      - refactor/reader-link-hints

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/reader-link-hints
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply guarded extraction
        run: |
          node tools/apply-reader-link-hints-extraction.mjs
          rm tools/apply-reader-link-hints-extraction.mjs .github/workflows/apply-reader-link-hints-once.yml
      - name: Format and verify
        run: |
          npx prettier --write src/reader/controller.ts src/reader/types.ts src/reader/link-hints.ts tests/unit/reader-controller.test.ts docs/DEVELOPMENT.md
          npm run verify
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(reader): isolate PDF link hint lifecycle"
          git push origin HEAD:refactor/reader-link-hints
