name: Dev XPI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        default: linux
        type: choice
        options:
          - linux
          - windows
          - both

permissions:
  contents: read

jobs:
  build-linux:
    name: Build XPI on Ubuntu
    if: ${{ inputs.platform == 'linux' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and verify XPI
        run: ./tools/build.sh
      - name: Upload XPI
        uses: actions/upload-artifact@v7
        with:
          name: zotero-neo-xpi-linux
          path: zotero-neo.xpi
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows:
    name: Build XPI on Windows
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'both' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and verify XPI
        shell: pwsh
        run: ./tools/build.ps1
      - name: Upload XPI
        uses: actions/upload-artifact@v7
        with:
          name: zotero-neo-xpi-windows
          path: zotero-neo.xpi
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
