name: Dev XPI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        default: linux
        type: choice
        options:
          - linux
          - windows
          - both

permissions:
  contents: read

jobs:
  build-linux:
    name: Build XPI on Ubuntu
    if: ${{ inputs.platform == 'linux' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    steps:
      # Verified upstream ref: https://api.github.com/repos/actions/checkout/git/ref/tags/v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Verified upstream ref: https://api.github.com/repos/actions/setup-node/git/ref/tags/v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and verify XPI
        run: ./tools/build.sh
      - name: Upload XPI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7; https://api.github.com/repos/actions/upload-artifact/git/ref/tags/v7
        with:
          name: zotero-neo-xpi-linux
          path: zotero-neo.xpi
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows:
    name: Build XPI on Windows
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'both' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and verify XPI
        shell: pwsh
        run: ./tools/build.ps1
      - name: Upload XPI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zotero-neo-xpi-windows
          path: zotero-neo.xpi
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
