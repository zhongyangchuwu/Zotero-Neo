name: Remove legacy Reader text hints

on:
  push:
    branches:
      - refactor/reader-text-navigation
    paths:
      - tools/remove-reader-text-hints.mjs
      - .github/workflows/remove-reader-text-hints-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/reader-text-navigation
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Remove legacy text hints and scaffolding
        run: |
          node tools/remove-reader-text-hints.mjs
          rm tools/remove-reader-text-hints.mjs .github/workflows/remove-reader-text-hints-once.yml
      - name: Format and verify
        run: |
          npx prettier --write src/reader/controller.ts docs/USER_GUIDE.md
          npm run verify
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(reader): remove legacy text hints"
          git push origin HEAD:refactor/reader-text-navigation
