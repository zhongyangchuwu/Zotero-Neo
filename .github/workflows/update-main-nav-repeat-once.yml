name: Update main navigation repeat once

on:
  push:
    branches:
      - feat/reader-flash-text
    paths:
      - .github/workflows/update-main-nav-repeat-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/reader-flash-text
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply navigation repeat fix
        run: |
          node tools/update-main-nav-repeat.mjs
          rm tools/update-main-nav-repeat.mjs .github/workflows/update-main-nav-repeat-once.yml
      - name: Format and verify
        run: |
          npx prettier --write src/main/controller.ts src/main/navigation.ts src/main/session.ts tests/unit/main-window.test.ts
          npm run verify
      - name: Commit navigation repeat fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(main): smooth repeated tree navigation"
          git push origin HEAD:feat/reader-flash-text
# retry after updating the legacy repeat pacing regression
