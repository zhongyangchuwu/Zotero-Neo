name: Pre-release architecture migration (temporary)

on:
  push:
    branches:
      - refactor/pre-release-architecture

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply guarded migration
        run: node tools/migrate-pre-release-architecture.mjs
      - name: Format
        run: npm run format
      - name: Verify
        run: npm run verify
      - name: Check diff
        run: git diff --check
      - name: Commit verified product changes and remove migration scaffold
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/migrate-pre-release-architecture.mjs .github/workflows/pre-release-architecture-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(input): unify Main Item Select with shared bindings"
          git push
