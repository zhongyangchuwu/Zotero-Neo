name: Fix Select host boundary once

on:
  push:
    branches:
      - feat/reader-flash-text
    paths:
      - .github/workflows/fix-select-host-boundary-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/reader-flash-text
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Select host-boundary fix
        run: |
          node tools/fix-select-host-boundary.mjs
          rm tools/fix-select-host-boundary.mjs .github/workflows/fix-select-host-boundary-once.yml
      - name: Format and verify
        run: |
          npx prettier --write src/reader/controller.ts src/reader/selection-text.ts docs/USER_GUIDE.md docs/DEVELOPMENT.md
          npm run verify
      - name: Commit Select host-boundary fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reader): avoid unsynced native PDF selection state"
          git push origin HEAD:feat/reader-flash-text
