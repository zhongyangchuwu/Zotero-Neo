name: Repository hygiene (temporary)

on:
  push:
    branches:
      - refactor/pre-release-architecture

permissions:
  contents: write

jobs:
  delete-merged-topic-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Delete obsolete merged topic branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            chore/fuzzysort-matcher
            chore/repository-cleanup
            chore/repository-cleanup-final
            ci/dev-xpi-linux-default
            feat/flash-unicode-ime
            feat/item-tag-editor
            feat/reader-flash-text
            feat/reader-sidebar-toggle-shortcuts
            fix/reader-geometry-vertical-motion
            refactor/reader-comment-editor-state
            refactor/reader-link-hints
            refactor/reader-marks-explorer-state
            refactor/reader-outline-state
            refactor/reader-smooth-scroll-state
            refactor/reader-text-navigation
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "deleting $branch"
              git push origin --delete "$branch"
            else
              echo "already absent: $branch"
            fi
          done
