name: Update Select native behavior once

on:
  push:
    branches:
      - feat/reader-flash-text
    paths:
      - .github/workflows/update-select-native-behavior-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/reader-flash-text
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Select native behavior changes
        run: |
          node tools/update-select-native-behavior.mjs
          rm tools/update-select-native-behavior.mjs .github/workflows/update-select-native-behavior-once.yml
      - name: Format and verify
        run: |
          npx prettier --write src/reader/controller.ts src/reader/selection-text.ts tests/unit/selection-text.test.ts docs/USER_GUIDE.md docs/DEVELOPMENT.md
          npm run verify
      - name: Commit Select native behavior changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refine(reader): reuse native Select rendering and copy"
          git push origin HEAD:feat/reader-flash-text
