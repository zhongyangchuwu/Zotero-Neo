<vbox
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  id="zotero-neo-prefs"
  style="padding: 16px; min-width: 420px;"
>
  <html:style>
    #zotero-neo-prefs {
      color: var(--zotero-neo-text, inherit);
      background: var(--zotero-neo-surface, transparent);
    }
    #zotero-neo-prefs html|p {
      color: var(--zotero-neo-muted, #666);
    }
  </html:style>

  <label value="Zotero Neo" style="font-weight: bold; font-size: 1.15em;" />
  <html:p style="margin: 6px 0 12px;">
    All Zotero Neo settings are managed in the Neo Settings workspace.
  </html:p>
  <hbox align="center">
    <button id="zv-open-neo-settings" label="Open Neo Settings" />
    <html:span
      id="zv-open-neo-settings-status"
      role="status"
      style="margin-left: 10px;"
    ></html:span>
  </hbox>
</vbox>
